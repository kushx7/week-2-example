  <circle cx="110" cy="245" r="28" fill="url(#warm-grad)"/>
  <polygon points="102,232 124,245 102,258" fill="#ffffff"/>
  <text x="160" y="235" fill="#fafaf9" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Brand Identity & Digital Assets</text>
