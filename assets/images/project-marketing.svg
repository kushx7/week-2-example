  </defs>
  <rect width="600" height="360" rx="16" fill="url(#mkt-bg)"/>
  <rect x="30" y="30" width="540" height="300" rx="12" fill="#1c1917" fill-opacity="0.8" stroke="#44403c" stroke-width="1.5"/>
  <!-- Analytics Grid -->
  <rect x="60" y="60" width="220" height="110" rx="8" fill="#292524" stroke="#57534e" stroke-width="1"/>
