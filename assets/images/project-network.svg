<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="net-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>
  <rect width="600" height="360" rx="16" fill="url(#net-bg)"/>
  <rect x="30" y="30" width="540" height="300" rx="12" fill="#061a14" fill-opacity="0.8" stroke="#134e4a" stroke-width="1.5"/>
  <!-- Topology Lines -->
  <line x1="300" y1="90" x2="150" y2="190" stroke="#0d9488" stroke-width="2" stroke-dasharray="4"/>
  <line x1="300" y1="90" x2="450" y2="190" stroke="#0d9488" stroke-width="2" stroke-dasharray="4"/>
  <line x1="150" y1="190" x2="300" y2="280" stroke="#0d9488" stroke-width="2"/>
  <line x1="450" y1="190" x2="300" y2="280" stroke="#0d9488" stroke-width="2"/>
  <!-- Central Router Node -->
  <circle cx="300" cy="90" r="32" fill="#042f2e" stroke="#14b8a6" stroke-width="3"/>
  <text x="300" y="85" fill="#5eead4" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">ROUTER</text>
  <text x="300" y="99" fill="#99f6e4" font-family="monospace" font-size="9" text-anchor="middle">192.168.1.1</text>
  <!-- Node A (Linux Server) -->
  <circle cx="150" cy="190" r="28" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <text x="150" y="186" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">DEBIAN</text>
  <text x="150" y="198" fill="#94a3b8" font-family="monospace" font-size="8" text-anchor="middle">SSH / DNS</text>
  <!-- Node B (Firewall) -->
  <circle cx="450" cy="190" r="28" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
  <text x="450" y="186" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">IPTABLES</text>
  <text x="450" y="198" fill="#cbd5e1" font-family="monospace" font-size="8" text-anchor="middle">GATEWAY</text>
  <!-- Bottom Node (Client Subnet) -->
  <circle cx="300" cy="280" r="26" fill="#042f2e" stroke="#10b981" stroke-width="2"/>
  <text x="300" y="278" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">DHCP POOL</text>
  <text x="300" y="290" fill="#a7f3d0" font-family="monospace" font-size="8" text-anchor="middle">/24 V-LAN</text>
  <!-- Active Signals -->
  <circle cx="225" cy="140" r="4" fill="#5eead4"/>
  <circle cx="375" cy="140" r="4" fill="#f59e0b"/>
</svg>
