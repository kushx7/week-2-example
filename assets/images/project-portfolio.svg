  <rect x="180" y="80" width="215" height="14" rx="4" fill="url(#brand-grad)"/>
  <rect x="180" y="102" width="170" height="8" rx="4" fill="#52525b"/>
  <rect x="180" y="116" width="195" height="8" rx="4" fill="#3f3f46"/>
