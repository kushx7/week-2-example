      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
