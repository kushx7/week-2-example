  </defs>
  <rect width="600" height="360" rx="16" fill="url(#web-bg)"/>
  <!-- Desktop Screen Mockup -->
  <rect x="50" y="45" width="360" height="240" rx="10" fill="#09090b" stroke="#4f46e5" stroke-width="2"/>
  <rect x="50" y="45" width="360" height="24" rx="10" fill="#18181b"/>
  <circle cx="65" cy="57" r="4.5" fill="#ef4444"/>
  <circle cx="80" cy="57" r="4.5" fill="#f59e0b"/>
  <circle cx="95" cy="57" r="4.5" fill="#10b981"/>
  <rect x="120" y="50" width="180" height="14" rx="7" fill="#27272a"/>
